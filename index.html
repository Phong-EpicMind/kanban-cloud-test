<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1><span class="logo">▦</span> Kanban</h1>
  <input id="search" type="search" placeholder="Tìm thẻ…  ( / )" aria-label="Tìm kiếm">
  <select id="filterPrio" aria-label="Lọc ưu tiên">
    <option value="">Mọi ưu tiên</option>
    <option value="high">Cao</option><option value="med">Trung bình</option><option value="low">Thấp</option>
  </select>
  <button id="themeBtn" class="icon-btn" title="Đổi giao diện">◐</button>
  <button id="addCol" class="btn">+ Cột</button>
</header>
<main id="board" class="board" aria-label="Bảng Kanban"></main>

<dialog id="dlg">
  <form method="dialog" id="cardForm">
    <h2 id="dlgTitle">Thẻ mới</h2>
    <label>Tiêu đề<input name="title" required maxlength="120"></label>
    <label>Mô tả<textarea name="desc" rows="3"></textarea></label>
    <div class="row">
      <label>Ưu tiên
        <select name="prio"><option value="low">Thấp</option><option value="med" selected>Trung bình</option><option value="high">Cao</option></select>
      </label>
      <label>Hạn chót<input type="date" name="due"></label>
    </div>
    <label>Nhãn (cách nhau bằng dấu phẩy)<input name="tags" placeholder="design, bug"></label>
    <div class="actions">
      <button type="button" id="delCard" class="btn danger">Xoá</button>
      <span class="spacer"></span>
      <button type="button" id="cancel" class="btn ghost">Huỷ</button>
      <button class="btn" value="ok">Lưu</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
